<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Tugas Dasar-Dasar Web - Pancasila</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
        }

        .container {
            width: 750px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .identitas {
            text-align: center;
            margin-bottom: 40px;
            font-size: 22px;
        }

        .identitas p {
            margin: 5px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            vertical-align: middle;
            padding-top: 15px;
            padding-bottom: 15px;
        }

        .kolom-kiri {
            width: 140px;
            text-align: left;
        }

        .kolom-kanan {
            width: 140px;
            text-align: right;
        }

        .teks-kiri {
            text-align: left;
            font-weight: bold;
            font-size: 24px;
            padding-left: 10px;
        }

        .teks-kanan {
            text-align: right;
            font-weight: bold;
            font-size: 24px;
            padding-right: 10px;
        }

        img {
            width: 120px;
            display: block;
        }

        .kolom-kanan img {
            margin-left: auto;
        }

        .dengan-border {
            border: 3px solid #777;
            padding: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>PANCASILA</h1>

        <div class="identitas">
            <p><strong>Nama:</strong> Ficko Adiputra Perdana</p>
            <p><strong>Kelas:</strong> XI RPL | <strong>Absen:</strong> 15</p>
        </div>

        <table>
            <tr>
                <td class="kolom-kiri">
                    <img src="bintang.jpg" alt="Bintang" class="dengan-border">
                </td>
                <td class="teks-kiri">Ketuhanan Yang Maha Esa</td>
                <td class="kolom-kanan"></td>
            </tr>

            <tr>
                <td class="kolom-kiri"></td>
                <td class="teks-kanan">Kemanusiaan Yang Adil dan Beradab</td>
                <td class="kolom-kanan">
                    <img src="rantai.jpg" alt="Rantai">
                </td>
            </tr>

            <tr>
                <td class="kolom-kiri">
                    <img src="pohon-beringin.jpg" alt="Pohon Beringin" class="dengan-border">
                </td>
                <td class="teks-kiri">Persatuan Indonesia</td>
                <td class="kolom-kanan"></td>
            </tr>

            <tr>
                <td class="kolom-kiri"></td>
                <!-- Tambahkan style="white-space: nowrap;" di baris bawah ini -->
                <td class="teks-kanan" style="white-space: nowrap;">
                    Kerakyatan yang dipimpin oleh hikmat kebijaksanaan<br>
                    dalam permusyawaratan perwakilan
                </td>
                <td class="kolom-kanan">
                    <img src="kepala-banteng.jpg" alt="Kepala Banteng">
                </td>
            </tr>

            <tr>
                <td class="kolom-kiri">
                    <img src="padi-kapas.jpg" alt="Padi dan Kapas" class="dengan-border">
                </td>
                <td class="teks-kiri">Keadilan sosial bagi seluruh rakyat Indonesia</td>
                <td class="kolom-kanan"></td>
            </tr>
        </table>
    </div>

</body>

</html>
